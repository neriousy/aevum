name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs

      - name: Build Windows installers and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aevum ${{ github.ref_name }}"
          releaseBody: "Windows installers for Aevum. The NSIS setup is recommended for most people; the MSI is available for managed deployment."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
