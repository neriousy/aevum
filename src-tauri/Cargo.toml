[package]
name = "aevum"
version = "0.1.1"
description = "Private, local voice-to-text for Windows"
authors = ["Neriousy and contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/neriousy/aevum"

[lib]
name = "aevum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Aevum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
